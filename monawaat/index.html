<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>وركر الإشعارات</title>
<style>
  body{font-family:system-ui,'Segoe UI',Tahoma,sans-serif;background:#0A3A7D;color:#fff;
       display:grid;place-items:center;min-height:100vh;margin:0;padding:24px;}
  .card{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);
        border-radius:18px;padding:28px 26px;max-width:460px;line-height:1.9;}
  h1{margin:0 0 10px;font-size:20px}
  code{background:rgba(0,0,0,.28);padding:2px 7px;border-radius:6px;font-size:13px;direction:ltr;display:inline-block}
  p{margin:8px 0;font-size:14px;opacity:.92}
</style>
</head>
<body>
  <div class="card">
    <h1>وركر الإشعارات شغال ✅</h1>
    <p>الخدمة دي بتبعت رسايل تليجرام لكل طلب جديد وكل تغيير في حالة الطلب.</p>
    <p>نقطة التشغيل: <code>/api/worker?key=…</code></p>
    <p>مش صفحة للعملاء — الكرون بس هو اللي بينادي الرابط.</p>
  </div>
</body>
</html>
